name: Publicar site no GitHub Pages

# A cada atualização da main, copia os arquivos do site para a branch gh-pages,
# que o GitHub Pages publica em https://igorlemos01.github.io/jurislab-site/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar e enviar a branch gh-pages
        run: |
          mkdir site
          cp index.html styles.css script.js .nojekyll site/
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar site a partir de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
